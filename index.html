<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NAS Gallery</title><link rel="stylesheet" href="style.css"><script src="config.js"></script><script defer src="app.js"></script></head><body>
<header><a class="brand" href="#">NAS <b>GALLERY</b></a><button id="adminOpen">Admin</button></header><main><section class="hero"><small>PERSONAL MEDIA COLLECTION</small><h1 id="siteTitle">Explore my world.</h1><p id="siteDescription">A collection of images and videos, hosted on my NAS.</p></section><section id="galleryGrid" class="galleries">Connecting…</section><section id="galleryView" class="hidden"><button id="back">← All galleries</button><h2 id="galleryTitle"></h2><p id="galleryDescription"></p><div id="mediaGrid" class="media"></div><button id="more" class="hidden">Load more</button></section></main><footer>NAS Gallery · Public media collection</footer>
<div id="viewer" class="viewer hidden"><button id="closeViewer">×</button><button id="prev">‹</button><div id="viewerBody"></div><button id="next">›</button><p id="viewerName"></p></div>
<div id="admin" class="overlay hidden"><div class="panel"><button class="x" data-close="admin">×</button><div id="login"><h2>Administrator</h2><p>Sign in to manage this site.</p><form id="loginForm"><input id="password" type="password" placeholder="Admin password" required><button>Unlock</button><p id="loginError" class="error"></p></form></div><div id="dashboard" class="hidden"><div class="row"><h2>Manage site</h2><button id="logout">Log out</button></div><nav><button data-tab="gTab">Galleries</button><button data-tab="aTab">Appearance</button></nav><section id="gTab"><div class="row"><h3>Galleries</h3><button id="addGallery">＋ New gallery</button></div><div id="adminList"></div><form id="galleryForm" class="editor hidden"><h3 id="formTitle">New gallery</h3><input id="gid" type="hidden"><label>Title<input id="gtitle" maxlength="80" required></label><label>Description<textarea id="gdesc" maxlength="300"></textarea></label><label>NAS folder<select id="folder" required></select></label><button type="button" id="browse">Browse folders</button><div id="folderBrowser" class="hidden"><div id="folderPath"></div><div id="folderList"></div></div><div class="row"><button type="button" id="cancel">Cancel</button><button>Save gallery</button></div><p id="gerror" class="error"></p></form></section><section id="aTab" class="hidden"><h3>Appearance</h3><form id="appearance"><label>Site title<input id="sTitle"></label><label>Site description<input id="sDesc"></label><label>Theme preset<select id="theme"><option value="midnight">Midnight</option><option value="ocean">Ocean</option><option value="forest">Forest</option><option value="sunset">Sunset</option><option value="light">Light</option></select></label><label>Background color<input id="bgColor" type="color"></label><label>Background image URL<input id="bgImage" type="url" placeholder="https://..."></label><button>Save appearance</button><p id="aMessage"></p></form></section></div></div></div></body></html>
